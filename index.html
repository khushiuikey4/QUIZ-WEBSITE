<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="title">
            <div class="logo"></div> QUICK QUIZ
        </div>
        <div class="quiz-box">
            <div class="question-box">Loading...</div>
            <div class="opt-box">
                <div class="opt">
                    <input id="a" class="option-inp" type="radio" name="option" value="a">
                    <label for="a" class="option-name">Loading...</label>
                </div>
                <div class="opt">
                    <input id="a" class="option-inp" type="radio" name="option" value="a">
                    <label for="a" class="option-name">Loading...</label>
                </div>
                <div class="opt">
                    <input id="a" class="option-inp" type="radio" name="option" value="a">
                    <label for="a" class="option-name">Loading...</label>
                </div>
                <div class="opt">
                    <input id="a" class="option-inp" type="radio" name="option" value="a">
                    <label for="a" class="option-name">Loading...</label>
                </div>
                <div class="next-btn">
                    <button class="n-btn p">PREVIOUS</button>
                    <button class="n-btn n">NEXT</button>

                </div>
            </div>
        </div>


        <div class="buttons">
            <button class="reset btn">RESET</button>
            <button class="submit btn">SUBMIT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
